name: test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Python compile
        shell: pwsh
        run: python -m py_compile .\src\remote_log.py .\src\remote_runner.py

      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem .\scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List
            exit 1
          }
